<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Curves · f(x,y) = y sin x</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c14;
    --panel: #0d1320;
    --border: #1e2d45;
    --gold: #f5c518;
    --gold-dim: #f5c51866;
    --cyan: #3ecfcf;
    --text: #c8d8e8;
    --text-dim: #5a7090;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    gap: 20px;
  }

  header {
    text-align: center;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: #fff;
    letter-spacing: 0.02em;
  }

  header h1 em {
    color: var(--gold);
    font-style: italic;
  }

  header p {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .main-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 860px;
    box-shadow: 0 8px 48px #000a;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/2;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Overlay badge top-left */
  .badge {
    position: absolute;
    top: 10px; left: 12px;
    background: #080c14cc;
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--gold);
    pointer-events: none;
    backdrop-filter: blur(4px);
    transition: color 0.2s;
  }

  /* Colorbar axis labels */
  .cbar-wrap {
    position: absolute;
    right: 6px; top: 8px; bottom: 8px;
    width: 28px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
  }

  .cbar-label {
    font-size: 0.6rem;
    color: var(--text-dim);
    text-align: right;
  }

  /* ── Slider controls ── */
  .controls {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .slider-row label {
    font-size: 0.78rem;
    color: var(--text-dim);
    width: 14px;
    text-align: center;
    font-style: italic;
  }

  input[type=range] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--gold) var(--pct, 50%), var(--border) var(--pct, 50%));
    outline: none;
    cursor: pointer;
    transition: height 0.15s;
  }

  input[type=range]:hover { height: 6px; }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px var(--gold-dim);
    cursor: grab;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  input[type=range]:active::-webkit-slider-thumb {
    transform: scale(1.25);
    box-shadow: 0 0 16px var(--gold);
    cursor: grabbing;
  }

  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px var(--gold-dim);
    cursor: grab;
  }

  .val-display {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--gold);
    width: 68px;
    text-align: right;
    white-space: nowrap;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  button:hover {
    color: var(--gold);
    border-color: var(--gold-dim);
    background: #f5c51811;
  }

  button.active {
    color: var(--cyan);
    border-color: var(--cyan);
    background: #3ecfcf18;
  }

  footer-note {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.05em;
    display: block;
  }
</style>
</head>
<body>

<header>
  <h1>Level Curves of <em>f(x, y) = y · sin x</em></h1>
  <p>Drag the slider to explore the curve f(x,y) = c</p>
</header>

<div class="main-card">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">c = 0.00</div>
  </div>

  <div class="controls">
    <div class="slider-row">
      <label>c</label>
      <input type="range" id="slider" min="-4" max="4" step="0.01" value="0">
      <span class="val-display" id="valDisplay">c = 0.00</span>
    </div>
    <div class="btn-row">
      <button id="btnBg" class="active" title="Toggle background surface">Surface</button>
      <button id="btnGrid" title="Toggle grid lines">Grid</button>
      <button id="btnReset">Reset</button>
    </div>
  </div>
</div>

<footer-note>
  The gold curve traces all (x,y) satisfying y · sin x = c &nbsp;·&nbsp;
  x ∈ [−2π, 2π] &nbsp;·&nbsp; y ∈ [−4, 4]
</footer-note>

<script>
// ─── Setup ────────────────────────────────────────────────────────────────────
const cv     = document.getElementById('cv');
const ctx    = cv.getContext('2d');
const slider = document.getElementById('slider');
const badge  = document.getElementById('badge');
const valDsp = document.getElementById('valDisplay');
const wrap   = document.getElementById('canvasWrap');
const btnBg  = document.getElementById('btnBg');
const btnGrid= document.getElementById('btnGrid');
const btnRst = document.getElementById('btnReset');

// Domain
const X0 = -2*Math.PI, X1 = 2*Math.PI;
const Y0 = -4,          Y1 = 4;

// State
let showSurface = true;
let showGrid    = false;
let c = 0;

// ─── Sizing ───────────────────────────────────────────────────────────────────
function resize() {
  const rect = wrap.getBoundingClientRect();
  cv.width  = Math.round(rect.width  * devicePixelRatio);
  cv.height = Math.round(rect.height * devicePixelRatio);
  render();
}

// ─── Coordinate transforms ────────────────────────────────────────────────────
function xToPixel(x) { return (x - X0) / (X1 - X0) * cv.width; }
function yToPixel(y) { return (1 - (y - Y0) / (Y1 - Y0)) * cv.height; }

// ─── Color mapping (RdBu diverging) ──────────────────────────────────────────
function rdbu(t) {
  // t in [0,1]: 0=deep blue, 0.5=white, 1=deep red
  const stops = [
    [0.020, 0.169, 0.490],
    [0.067, 0.353, 0.714],
    [0.380, 0.671, 0.859],
    [0.780, 0.875, 0.941],
    [0.969, 0.969, 0.969],
    [0.992, 0.859, 0.780],
    [0.957, 0.647, 0.510],
    [0.839, 0.376, 0.302],
    [0.698, 0.094, 0.169],
  ];
  const n = stops.length - 1;
  const i = Math.min(Math.floor(t * n), n - 1);
  const frac = t * n - i;
  const a = stops[i], b = stops[i+1];
  const r = Math.round((a[0] + frac*(b[0]-a[0]))*255);
  const g = Math.round((a[1] + frac*(b[1]-a[1]))*255);
  const bv = Math.round((a[2] + frac*(b[2]-a[2]))*255);
  return [r, g, bv];
}

// ─── Build surface image once (updated when toggled) ─────────────────────────
let surfaceCache = null;
let cacheW = 0, cacheH = 0;

function buildSurface() {
  const W = cv.width, H = cv.height;
  if (W === cacheW && H === cacheH && surfaceCache) return;
  const img = ctx.createImageData(W, H);
  const data = img.data;
  const fMin = -4, fMax = 4; // clamp range

  for (let py = 0; py < H; py++) {
    const y = Y1 - (py / H) * (Y1 - Y0);
    for (let px = 0; px < W; px++) {
      const x = X0 + (px / W) * (X1 - X0);
      const f = y * Math.sin(x);
      const clamped = Math.max(fMin, Math.min(fMax, f));
      const t = (clamped - fMin) / (fMax - fMin); // [0,1]
      const [r, g, b] = rdbu(t);
      const idx = (py * W + px) * 4;
      data[idx]   = r;
      data[idx+1] = g;
      data[idx+2] = b;
      data[idx+3] = 220;
    }
  }
  surfaceCache = img;
  cacheW = W; cacheH = H;
}

// ─── Marching squares for a single level ─────────────────────────────────────
// Returns array of line segments [{x1,y1,x2,y2}] in pixel coords
function marchingSquares(cLevel) {
  const COLS = 400, ROWS = 300;
  const dx = (X1 - X0) / COLS;
  const dy = (Y1 - Y0) / ROWS;

  // Sample grid
  const grid = new Float32Array((COLS+1) * (ROWS+1));
  for (let j = 0; j <= ROWS; j++) {
    const y = Y0 + j * dy;
    for (let i = 0; i <= COLS; i++) {
      const x = X0 + i * dx;
      grid[j*(COLS+1)+i] = y * Math.sin(x) - cLevel;
    }
  }

  const segs = [];

  function lerp(va, vb, xa, ya, xb, yb) {
    // find zero crossing between a and b
    const t = va / (va - vb);
    return { x: xa + t*(xb-xa), y: ya + t*(yb-ya) };
  }

  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const x0 = X0 + i*dx, y0 = Y0 + j*dy;
      const x1 = x0+dx,     y1 = y0+dy;

      const v00 = grid[j*(COLS+1)+i];
      const v10 = grid[j*(COLS+1)+i+1];
      const v01 = grid[(j+1)*(COLS+1)+i];
      const v11 = grid[(j+1)*(COLS+1)+i+1];

      // Corners bitmask
      const idx =
        (v00 > 0 ? 1 : 0) |
        (v10 > 0 ? 2 : 0) |
        (v11 > 0 ? 4 : 0) |
        (v01 > 0 ? 8 : 0);

      if (idx === 0 || idx === 15) continue; // all same side

      // Edge midpoints (lazy: only compute needed)
      const mB = () => lerp(v00, v10, x0, y0, x1, y0); // bottom
      const mR = () => lerp(v10, v11, x1, y0, x1, y1); // right
      const mT = () => lerp(v01, v11, x0, y1, x1, y1); // top
      const mL = () => lerp(v00, v01, x0, y0, x0, y1); // left

      let pairs = [];
      switch(idx) {
        case 1:  pairs = [mB(), mL()]; break;
        case 2:  pairs = [mB(), mR()]; break;
        case 3:  pairs = [mL(), mR()]; break;
        case 4:  pairs = [mR(), mT()]; break;
        case 5:  pairs = [mB(), mR(), mL(), mT()]; break; // saddle
        case 6:  pairs = [mB(), mT()]; break;
        case 7:  pairs = [mL(), mT()]; break;
        case 8:  pairs = [mL(), mT()]; break;
        case 9:  pairs = [mB(), mT()]; break;
        case 10: pairs = [mB(), mL(), mR(), mT()]; break; // saddle
        case 11: pairs = [mR(), mT()]; break;
        case 12: pairs = [mL(), mR()]; break;
        case 13: pairs = [mB(), mR()]; break;
        case 14: pairs = [mB(), mL()]; break;
      }

      for (let k = 0; k < pairs.length; k += 2) {
        const p = pairs[k], q = pairs[k+1];
        segs.push({
          x1: xToPixel(p.x), y1: yToPixel(p.y),
          x2: xToPixel(q.x), y2: yToPixel(q.y),
        });
      }
    }
  }
  return segs;
}

// ─── Background grid lines (faint contours) ──────────────────────────────────
let gridSegCache = null;
let gridCacheW = 0, gridCacheH = 0;

function buildGridSegs() {
  if (cv.width === gridCacheW && cv.height === gridCacheH && gridSegCache) return;
  const levels = [];
  for (let l = -4; l <= 4; l += 0.5) if (Math.abs(l) > 0.01) levels.push(l);
  gridSegCache = levels.map(l => marchingSquares(l));
  gridCacheW = cv.width; gridCacheH = cv.height;
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render() {
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#080c14';
  ctx.fillRect(0, 0, W, H);

  // Surface
  if (showSurface) {
    buildSurface();
    ctx.putImageData(surfaceCache, 0, 0);
  }

  // Grid lines
  if (showGrid) {
    buildGridSegs();
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.20)';
    ctx.lineWidth = 0.8;
    for (const segs of gridSegCache) {
      for (const s of segs) {
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Axes
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  // x-axis (y=0)
  const yMid = yToPixel(0);
  ctx.beginPath(); ctx.moveTo(0, yMid); ctx.lineTo(W, yMid); ctx.stroke();
  // y-axis (x=0)
  const xMid = xToPixel(0);
  ctx.beginPath(); ctx.moveTo(xMid, 0); ctx.lineTo(xMid, H); ctx.stroke();
  ctx.restore();

  // Tick labels
  ctx.save();
  ctx.fillStyle = 'rgba(180,200,220,0.55)';
  ctx.font = `${Math.round(W*0.018)}px JetBrains Mono`;
  ctx.textAlign = 'center';
  const xTicks = [-2*Math.PI, -Math.PI, 0, Math.PI, 2*Math.PI];
  const xLabels = ['−2π', '−π', '0', 'π', '2π'];
  const fs = Math.round(W*0.018);
  xTicks.forEach((xt, k) => {
    const px = xToPixel(xt);
    ctx.fillText(xLabels[k], px, yMid + fs*1.5);
  });
  ctx.textAlign = 'right';
  [-3,-2,-1,1,2,3].forEach(yt => {
    ctx.fillText(yt, xMid - 4, yToPixel(yt) + fs*0.4);
  });
  ctx.restore();

  // Highlighted level curve
  const segs = marchingSquares(c);
  if (segs.length > 0) {
    ctx.save();

    // Glow pass
    ctx.strokeStyle = 'rgba(245,197,24,0.25)';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    for (const s of segs) {
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }

    // Sharp pass
    ctx.strokeStyle = '#f5c518';
    ctx.lineWidth = 2.5;
    for (const s of segs) {
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    ctx.restore();
  }

  // Colorbar on right edge
  const cbX = W - Math.round(W*0.032);
  const cbW = Math.round(W*0.018);
  const cbH = H - 24;
  const cbY = 12;
  for (let py = 0; py < cbH; py++) {
    const t = 1 - py/cbH;
    const [r,g,b] = rdbu(t);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(cbX, cbY+py, cbW, 1);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(cbX, cbY, cbW, cbH);

  // Colorbar c marker
  const clamped = Math.max(-4, Math.min(4, c));
  const markerY = cbY + cbH * (1 - (clamped+4)/8);
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.moveTo(cbX - 5, markerY);
  ctx.lineTo(cbX, markerY - 4);
  ctx.lineTo(cbX, markerY + 4);
  ctx.closePath();
  ctx.fill();
}

// ─── Slider update ────────────────────────────────────────────────────────────
function updateSliderGradient() {
  const min = parseFloat(slider.min);
  const max = parseFloat(slider.max);
  const pct = (c - min) / (max - min) * 100;
  slider.style.setProperty('--pct', pct + '%');
}

function setC(val) {
  c = val;
  const str = c >= 0 ? `c = +${c.toFixed(2)}` : `c = ${c.toFixed(2)}`;
  badge.textContent = str;
  valDsp.textContent = str;
  updateSliderGradient();
  render();
}

slider.addEventListener('input', () => setC(parseFloat(slider.value)));

// ─── Buttons ──────────────────────────────────────────────────────────────────
btnBg.addEventListener('click', () => {
  showSurface = !showSurface;
  btnBg.classList.toggle('active', showSurface);
  render();
});

btnGrid.addEventListener('click', () => {
  showGrid = !showGrid;
  btnGrid.classList.toggle('active', showGrid);
  render();
});

btnRst.addEventListener('click', () => {
  slider.value = '0';
  setC(0);
});

// ─── Responsive ───────────────────────────────────────────────────────────────
const ro = new ResizeObserver(resize);
ro.observe(wrap);

// ─── Keyboard support (arrow keys) ───────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
    const v = Math.min(4, Math.round((c + 0.05)*100)/100);
    slider.value = v; setC(v);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
    const v = Math.max(-4, Math.round((c - 0.05)*100)/100);
    slider.value = v; setC(v);
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
resize();
setC(0);
</script>
</body>
</html>
